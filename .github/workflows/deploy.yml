name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Provision: KV namespace ────────────────────────────────────────────
      - name: Provision KV namespace (SESSION)
        id: kv
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CF_API_TOKEN" | \
            jq -r '.result[] | select(.title=="social-pipeline-SESSION") | .id // empty')
          if [ -z "$EXISTING" ]; then
            KV_ID=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"social-pipeline-SESSION"}' | jq -r '.result.id')
            echo "Created KV namespace: $KV_ID"
          else
            KV_ID="$EXISTING"
            echo "Using existing KV namespace: $KV_ID"
          fi
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          # Inject into wrangler.toml (first empty id = "")
          sed -i "0,/id = \"\"/s//id = \"$KV_ID\"/" wrangler.toml
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # AI Gateway is shared and pre-provisioned; deployment never creates or enables it.

      # ── Provision: R2 bucket ───────────────────────────────────────────────
      - name: Provision R2 bucket
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/social-pipeline-uploads" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          if [ "$STATUS" = "404" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"social-pipeline-uploads"}' | jq '.success'
            echo "Created R2 bucket: social-pipeline-uploads"
          else
            echo "R2 bucket already exists"
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Provision: VAPID keys ──────────────────────────────────────────────
      - name: Generate VAPID keys (if not already set)
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/social-pipeline/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            jq -r '.result[]? | select(.name=="VAPID_PRIVATE_KEY") | .name // empty')
          if [ -z "$EXISTING" ]; then
            KEYS=$(npx web-push generate-vapid-keys --json)
            PUBLIC=$(echo "$KEYS" | jq -r '.publicKey')
            PRIVATE=$(echo "$KEYS" | jq -r '.privateKey')
            echo "$PRIVATE" | npx wrangler secret put VAPID_PRIVATE_KEY
            sed -i "s/REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY/$PUBLIC/" wrangler.toml
            echo "Generated and stored new VAPID keys"
          else
            echo "VAPID keys already set — skipping"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Convex: push env vars ──────────────────────────────────────────────
      - name: Set Convex environment variables
        run: |
          set_if_present() {
            local key="$1" val="$2"
            [ -n "$val" ] && npx convex env set "$key" "$val" || true
          }
          set_if_present CF_ACCOUNT_ID        "$CF_ACCOUNT_ID"
          set_if_present AUTH_GITHUB_ID       "$AUTH_GITHUB_ID"
          set_if_present AUTH_GITHUB_SECRET   "$AUTH_GITHUB_SECRET"
          set_if_present JWT_PRIVATE_KEY      "$JWT_PRIVATE_KEY"
          set_if_present JWKS                 "$JWKS"
          set_if_present AUTH_RESEND_KEY      "$AUTH_RESEND_KEY"
          set_if_present ADMIN_API_TOKEN      "$ADMIN_API_TOKEN"
          set_if_present OPENROUTER_API_KEY   "$OPENROUTER_API_KEY"
          set_if_present FIRECRAWL_API_KEY    "$FIRECRAWL_API_KEY"
          set_if_present ZERNIO_API_KEY       "$ZERNIO_API_KEY"
          set_if_present SITE_URL             "$SITE_URL"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWKS: ${{ secrets.JWKS }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

      # ── Convex: deploy functions ───────────────────────────────────────────
      - name: Deploy Convex functions
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # ── Convex: run migrations ─────────────────────────────────────────────
      - name: Run Convex migrations
        run: npx convex run migrations/runner:runPending '{}'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # ── Astro build + Wrangler deploy ──────────────────────────────────────
      - name: Build
        run: pnpm build
        env:
          PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
